# Neo4j graph store — Phase 1.5 knowledge IaC
# Usage (from repo root):
#   export NEO4J_PASSWORD=changeme   # required; match .env
#   docker compose -f infra/neo4j/compose.yml up -d
#   docker compose -f infra/neo4j/compose.yml down

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: nagp-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
