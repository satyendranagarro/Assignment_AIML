# Full local umbrella — knowledge (always) + optional runtime profiles.
#
# From repo root:
#   export NEO4J_PASSWORD=changeme
#   docker compose -f infra/compose.yml up -d
#     → Neo4j + Chroma only
#
#   docker compose -f infra/compose.yml --profile mcp up -d --build
#     → + MCP weather/currency sidecars
#
#   docker compose -f infra/compose.yml --profile app up -d --build
#     → + Streamlit on :8501
#
#   docker compose -f infra/compose.yml --profile mcp --profile app up -d --build
#     → knowledge + MCP + UI
#
#   docker compose -f infra/compose.yml --profile pipeline run --rm kb-pipeline \
#     python scripts/build_kb.py --embeddings fake
#
#   docker compose -f infra/compose.yml down

include:
  - path: neo4j/compose.yml
  - path: chroma/compose.yml
  - path: mcp-weather/compose.yml
  - path: mcp-currency/compose.yml
  - path: app/compose.yml

services:
  kb-pipeline:
    build:
      context: ..
      dockerfile: infra/kb-pipeline/Dockerfile
    profiles:
      - pipeline
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_PATH: /app/data/chroma
      PYTHONPATH: /app
    volumes:
      - ../data:/app/data
      - ../ontology:/app/ontology
    depends_on:
      neo4j:
        condition: service_healthy
      chroma:
        condition: service_healthy
    working_dir: /app
