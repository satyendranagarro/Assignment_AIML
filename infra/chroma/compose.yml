# Chroma vector store — Phase 1.5 knowledge IaC
# Usage (from repo root):
#   docker compose -f infra/chroma/compose.yml up -d
#   docker compose -f infra/chroma/compose.yml down
#
# App/pipeline: set CHROMA_HOST=localhost CHROMA_PORT=8000 (see .env.example).
# Offline without Docker: leave CHROMA_HOST unset and use CHROMA_PATH=data/chroma.

services:
  chroma:
    image: chromadb/chroma:0.5.23
    container_name: nagp-chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      PERSIST_DIRECTORY: /chroma/chroma
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  chroma_data:
